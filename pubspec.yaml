name: metadata_extractor
description: A powerful metadata extraction implementation for Flutter, enabling rich EXIF and media metadata retrieval.
version: 0.0.3
repository: https://github.com/Dinesh-DLanzer/metadata_extractor
issue_tracker: https://github.com/Dinesh-DLanzer/metadata_extractor/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  metadata_core: ^0.0.5
  exif: ^3.3.0
  ffmpeg_kit_flutter_new: ^4.1.0
  mime: ^2.0.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
